name: Commercial sites public QA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-sites:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/commercial-browser" --no-audit --no-fund playwright@1.63.0
          "$RUNNER_TEMP/commercial-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify 22 published sites
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/commercial-browser/node_modules/playwright/index.mjs
        run: node scripts/commercial-public-qa.mjs
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-public-qa
          path: qa-public/
          retention-days: 14
